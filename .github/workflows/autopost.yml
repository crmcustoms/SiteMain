name: Autopost — weekly generation

# Generates the whole coming week's articles (next Mon/Wed/Fri) in one run,
# each as its own PR with a `publish:<date>` label — NOT published yet. A
# separate workflow (autopost-publish.yml) auto-merges each PR on its own
# scheduled date. This gives a 2-6 day review window: open the PR's Netlify
# deploy-preview link, read it like a reader would, edit or close the PR if
# something's off. Untouched PRs publish themselves on schedule, no click
# needed.

on:
  schedule:
    # Sunday 15:00 UTC (18:00 Kyiv summer / 17:00 winter) — ahead of the
    # Mon/Wed/Fri publish days this generates for.
    - cron: '0 15 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Generate + validate only, do not write files or open PRs'
        required: false
        default: 'false'

concurrency:
  group: autopost
  cancel-in-progress: false

jobs:
  generate-week:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write # label create/apply lives under the Issues API even for PR labels
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Compute next Mon/Wed/Fri dates
        id: dates
        run: |
          echo "mon=$(date -u -d 'next monday' +%F)" >> "$GITHUB_OUTPUT"
          echo "wed=$(date -u -d 'next wednesday' +%F)" >> "$GITHUB_OUTPUT"
          echo "fri=$(date -u -d 'next friday' +%F)" >> "$GITHUB_OUTPUT"

      - name: Ensure labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create autopost --repo "$GITHUB_REPOSITORY" --color 6f42c1 --description "Auto-generated article" 2>/dev/null || true
          for d in "${{ steps.dates.outputs.mon }}" "${{ steps.dates.outputs.wed }}" "${{ steps.dates.outputs.fri }}"; do
            gh label create "publish:$d" --repo "$GITHUB_REPOSITORY" --color 0e8a16 --description "Auto-merges on $d" 2>/dev/null || true
          done

      - name: Generate 3 articles and open one PR each
        id: week
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          git config user.name "crmcustoms-autopost"
          git config user.email "crmcustoms.bot@users.noreply.github.com"

          SUMMARY_FILE="$RUNNER_TEMP/summary.txt"
          : > "$SUMMARY_FILE"
          mkdir -p "$RUNNER_TEMP/generated_blog" "$RUNNER_TEMP/generated_images"

          for DATE in "${{ steps.dates.outputs.mon }}" "${{ steps.dates.outputs.wed }}" "${{ steps.dates.outputs.fri }}"; do
            echo "::group::Generating for $DATE"

            # `git checkout main` at the end of each iteration removes that
            # iteration's now-committed file from the working tree (it's
            # tracked on the PR branch, not on main). loadCorpus() reads
            # content/blog/uk/ straight off disk, so without restoring
            # earlier iterations' files here first, later iterations in
            # this same run would be blind to what the run itself already
            # generated — duplicate topics/slots across the week. Restore
            # before generating, not after committing.
            cp -n "$RUNNER_TEMP"/generated_blog/*.md content/blog/uk/ 2>/dev/null || true
            cp -n "$RUNNER_TEMP"/generated_images/*.jpg public/images/blog/ 2>/dev/null || true

            if [ "$DRY_RUN" = "true" ]; then
              node scripts/autopost/generate.mjs --dry-run || true
              echo "::endgroup::"
              continue
            fi

            # generate.mjs writes its slug/title/etc as step outputs (via
            # $GITHUB_OUTPUT), not stdout — find the new file by diffing
            # the directory instead of parsing output.
            #
            # A real validation failure (content-quality, not a bug) is
            # expected occasionally — generate.mjs only self-retries on
            # slug/topic collisions, not on quality misses. Give it 2 tries
            # here; if both fail, skip this date rather than aborting the
            # whole week's batch over one flaky generation.
            FILE=""
            for ATTEMPT in 1 2; do
              BEFORE=$(ls content/blog/uk/ 2>/dev/null)
              if node scripts/autopost/generate.mjs; then
                FILE="content/blog/uk/$(comm -13 <(echo "$BEFORE" | sort) <(ls content/blog/uk/ | sort))"
                break
              fi
              echo "::warning::generate.mjs failed for $DATE (attempt $ATTEMPT/2)"
            done
            if [ -z "$FILE" ]; then
              echo "::warning::skipping $DATE — generation failed twice, needs a manual workflow_dispatch run"
              echo "⚠️ $DATE — генерація не пройшла двічі, запусти вручну (workflow_dispatch)" >> "$SUMMARY_FILE"
              git checkout main
              echo "::endgroup::"
              continue
            fi

            npm run build

            SLUG=$(basename "$FILE" .md)
            IMG="public/images/blog/$SLUG-illustration-1.jpg"
            TITLE=$(node -e "const m=require('gray-matter');console.log(m(require('fs').readFileSync('$FILE','utf8')).data.title)")
            EXCERPT=$(node -e "const m=require('gray-matter');console.log(m(require('fs').readFileSync('$FILE','utf8')).data.excerpt)")
            SLOT=$(node -e "const m=require('gray-matter');console.log(m(require('fs').readFileSync('$FILE','utf8')).data.slotType)")

            BRANCH="autopost/$DATE-$SLUG"
            git checkout -b "$BRANCH" main
            git add "$FILE"
            [ -f "$IMG" ] && git add "$IMG"
            git commit -m "Autopost: $TITLE"
            git push -u origin "$BRANCH"

            BODY=$(printf 'Автоматично згенеровано, публікація **%s** (Пн/Ср/Пт розклад) — якщо нічого не поправиш, змерджиться сама в цей день.\n\nСлот: `%s` · Slug: `%s`\n\n> %s' "$DATE" "$SLOT" "$SLUG" "$EXCERPT")
            PR_URL=$(gh pr create --repo "$GITHUB_REPOSITORY" \
              --base main --head "$BRANCH" \
              --title "[autopost $DATE] $SLOT — $TITLE" \
              --label "autopost,publish:$DATE" \
              --body "$BODY")

            PR_NUM=$(basename "$PR_URL")
            PREVIEW="https://deploy-preview-$PR_NUM--crmcustoms.netlify.app/uk/blog/$SLUG"
            echo "📅 $DATE — [$TITLE]($PREVIEW) (PR #$PR_NUM)" >> "$SUMMARY_FILE"

            # Persist before checkout wipes it off main's working tree, so
            # the next iteration can restore it (see comment above).
            cp "$FILE" "$RUNNER_TEMP/generated_blog/"
            [ -f "$IMG" ] && cp "$IMG" "$RUNNER_TEMP/generated_images/"

            git checkout main
            echo "::endgroup::"
          done

          {
            echo "digest<<EOF_DIGEST"
            cat "$SUMMARY_FILE"
            echo "EOF_DIGEST"
          } >> "$GITHUB_OUTPUT"

      - name: Notify with preview links
        if: ${{ inputs.dry_run != 'true' && steps.week.outputs.digest != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_CHAT_ID: ${{ secrets.TELEGRAM_CHANNEL_CHAT_ID }}
          DIGEST: ${{ steps.week.outputs.digest }}
        run: |
          TEXT=$(printf '⚠️ <b>Чернетки на тиждень (не публікація)</b>\nНічого не робиш → опублікується як є в свій день. Хочеш поправити — заходь у PR за посиланням.\n\n%s' "$DIGEST")
          curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d "chat_id=$TELEGRAM_CHANNEL_CHAT_ID" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text=$TEXT"

  backlog-guard:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Fail loudly if a scheduled publish date already passed unmerged
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(date -u +%F)
          STALE=$(gh pr list --repo "$GITHUB_REPOSITORY" --label autopost --state open --json labels,number \
            --jq '[.[] | select(.labels[].name | test("^publish:")) | {number, date: (.labels[].name | select(test("^publish:")) | ltrimstr("publish:"))}] | map(select(.date < "'"$TODAY"'"))')
          if [ "$STALE" != "[]" ]; then
            echo "::error::PR(s) whose publish date already passed are still open — autopost-publish.yml likely failed: $STALE"
            exit 1
          fi
