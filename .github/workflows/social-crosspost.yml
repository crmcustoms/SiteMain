name: Social cross-post

# Fires on every push to main that touches content/blog/uk — whether the
# post came from the autopost pipeline (after a human merges its PR) or was
# added by hand. Detects which .md files were newly added in that push and
# announces each one in the connected channels.

on:
  push:
    branches: [main, master]
    paths:
      - 'content/blog/uk/**.md'
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Post a Reels video to Facebook for an already-published article (URL of the .mp4)'
        required: false
      image_url:
        description: 'Post a single image to Facebook (URL of the .jpg/.png)'
        required: false
      article_url:
        description: 'Live article/link URL (required with video_url/image_url)'
        required: false
      title:
        description: 'Post title (required with video_url/image_url)'
        required: false
      excerpt:
        description: 'Post excerpt (optional)'
        required: false
      channels:
        description: 'With article_url and no video/image: where to announce (telegram, facebook, or both)'
        required: false
        default: 'telegram,facebook'

jobs:
  debug-facebook:
    if: ${{ inputs.article_url == '' && inputs.video_url == '' && inputs.title == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: List recent Page posts and check known post ids
        env:
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: |
          PAGE_TOKEN=$(curl -s "https://graph.facebook.com/v21.0/${FACEBOOK_PAGE_ID}?fields=access_token&access_token=${FACEBOOK_PAGE_TOKEN}" | jq -r '.access_token')
          echo "=== recent feed posts ==="
          curl -s "https://graph.facebook.com/v21.0/${FACEBOOK_PAGE_ID}/posts?fields=id,message,created_time,permalink_url,is_published,status_type&access_token=${PAGE_TOKEN}" | jq .
          echo "=== recent page videos ==="
          curl -s "https://graph.facebook.com/v21.0/${FACEBOOK_PAGE_ID}/videos?fields=id,description,created_time,permalink_url,status&access_token=${PAGE_TOKEN}" | jq .
          echo "=== known text post id ==="
          curl -s "https://graph.facebook.com/v21.0/1588039712873068?fields=id,message,permalink_url,is_published,status_type&access_token=${PAGE_TOKEN}" | jq .

  post-facebook:
    if: ${{ inputs.article_url != '' && inputs.video_url == '' && inputs.image_url == '' && contains(inputs.channels, 'facebook') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Post link to Facebook Page
        env:
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: |
          node scripts/social/post-facebook.mjs \
            --title "${{ inputs.title }}" \
            --excerpt "${{ inputs.excerpt }}" \
            --url "${{ inputs.article_url }}"

  # Manual re-announce of an already-live article. Needed when the merge
  # didn't trigger the push-based crosspost (a merge done with GITHUB_TOKEN,
  # e.g. by autopost-publish.yml, never starts other workflows) or the
  # crosspost gave up because the deploy was late.
  post-telegram:
    if: ${{ inputs.article_url != '' && inputs.video_url == '' && inputs.image_url == '' && contains(inputs.channels, 'telegram') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Post to Telegram channel
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_CHAT_ID: ${{ secrets.TELEGRAM_CHANNEL_CHAT_ID }}
          POST_TITLE: ${{ inputs.title }}
          POST_EXCERPT: ${{ inputs.excerpt }}
          POST_URL: ${{ inputs.article_url }}
        run: |
          SLUG=$(basename "$POST_URL")
          IMAGE="https://crmcustoms.com/images/blog/$SLUG-illustration-1.jpg"
          if [ "$(curl -s -o /dev/null -w '%{http_code}' "$IMAGE")" != "200" ]; then
            IMAGE="https://crmcustoms.com/api/og?title=$(node -e 'process.stdout.write(encodeURIComponent(process.argv[1]))' "$POST_TITLE")"
          fi
          node scripts/social/post-telegram.mjs \
            --title "$POST_TITLE" \
            --excerpt "$POST_EXCERPT" \
            --url "$POST_URL" \
            --image "$IMAGE"

  post-image:
    if: ${{ inputs.image_url != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Post image to Facebook Page
        env:
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: |
          node scripts/social/post-facebook.mjs \
            --title "${{ inputs.title }}" \
            --excerpt "${{ inputs.excerpt }}" \
            --url "${{ inputs.article_url }}" \
            --images "${{ inputs.image_url }}"

  post-video:
    if: ${{ inputs.video_url != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Post video to Facebook Page
        env:
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: |
          node scripts/social/post-facebook.mjs \
            --title "${{ inputs.title }}" \
            --excerpt "${{ inputs.excerpt }}" \
            --url "${{ inputs.article_url }}" \
            --video "${{ inputs.video_url }}"


  detect:
    runs-on: ubuntu-latest
    outputs:
      posts: ${{ steps.diff.outputs.posts }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Find newly added blog posts
        id: diff
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            ADDED=$(git diff --name-status --diff-filter=A HEAD~1 HEAD -- 'content/blog/uk/*.md' | cut -f2)
          else
            ADDED=$(git diff --name-status --diff-filter=A "$BEFORE" "${{ github.sha }}" -- 'content/blog/uk/*.md' | cut -f2)
          fi
          POSTS=$(node scripts/social/get-new-posts.mjs $ADDED)
          echo "posts=$POSTS" >> "$GITHUB_OUTPUT"
          echo "Detected posts: $POSTS"

  crosspost:
    needs: detect
    if: needs.detect.outputs.posts != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        post: ${{ fromJson(needs.detect.outputs.posts) }}
      fail-fast: false
    # GitHub's step-`if:` parser rejects the `secrets` context directly
    # ("Unrecognized named-value: 'secrets'") — route through job-level env
    # instead, which IS a valid context in `if:`.
    env:
      HAS_FB_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN != '' }}
      HAS_TELEGRAM_OWNER_CHAT: ${{ secrets.TELEGRAM_OWNER_CHAT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # Netlify's deploy for this same push is still running when this job
      # starts — announcing before the page is live means readers hit a
      # 404 for a few minutes. Poll the real URL instead of a blind sleep,
      # since deploy time varies; give up after 5 minutes rather than post
      # a dead link.
      - name: Wait for the article to be live before announcing it
        id: wait_live
        env:
          POST_URL: ${{ matrix.post.url }}
        run: |
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$POST_URL")
            echo "Attempt $i: $POST_URL -> $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Live — proceeding to announce."
              exit 0
            fi
            sleep 15
          done
          echo "::error::$POST_URL never returned 200 after 5 minutes — deploy likely still running or failed. Skipping social posts rather than announcing a dead link."
          exit 1

      # Without this a failed deploy is silent: the article is merged, never
      # live, never announced, and nobody notices for days (2026-09-30).
      # Private chat only — never the public channel.
      - name: Alert owner that the article did not go live
        if: ${{ failure() && steps.wait_live.outcome == 'failure' && env.HAS_TELEGRAM_OWNER_CHAT == 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          POST_TITLE: ${{ matrix.post.title }}
          POST_URL: ${{ matrix.post.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TEXT=$(printf '🚨 <b>Стаття не вийшла на сайт</b>\n%s\n%s\n\nЗа 5 хвилин сторінка не відкрилась — найімовірніше, впав деплой Netlify. Анонс НЕ відправлено.\n\n1. Netlify → crmcustoms → Deploys → Retry deploy\n2. Re-run failed jobs: %s' "$POST_TITLE" "$POST_URL" "$RUN_URL")
          curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d "chat_id=$TELEGRAM_OWNER_CHAT_ID" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text=$TEXT"

      - name: Post to Telegram (@prodayslonakume)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_CHAT_ID: ${{ secrets.TELEGRAM_CHANNEL_CHAT_ID }}
          POST_TITLE: ${{ matrix.post.title }}
          POST_EXCERPT: ${{ matrix.post.excerpt }}
          POST_URL: ${{ matrix.post.url }}
          POST_IMAGE: ${{ matrix.post.image }}
        run: |
          node scripts/social/post-telegram.mjs \
            --title "$POST_TITLE" \
            --excerpt "$POST_EXCERPT" \
            --url "$POST_URL" \
            --image "$POST_IMAGE"

      - name: Post to Facebook Page ("CRM на прокачку")
        if: ${{ env.HAS_FB_TOKEN == 'true' }}
        env:
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          POST_TITLE: ${{ matrix.post.title }}
          POST_EXCERPT: ${{ matrix.post.excerpt }}
          POST_URL: ${{ matrix.post.url }}
        run: |
          node scripts/social/post-facebook.mjs \
            --title "$POST_TITLE" \
            --excerpt "$POST_EXCERPT" \
            --url "$POST_URL"
