<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Customs - Діагностика</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-bg: #FFFFFF;
            --color-text: #000000;
            --color-accent: #FFD700;
            --color-border: #E5E5E5;
            --color-secondary: #A3A3A3;
            --font-main: 'Inter', sans-serif;
            --font-mono: 'Space Mono', monospace;
        }

        body {
            font-family: var(--font-main);
            background: var(--color-bg);
            color: var(--color-text);
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 80px 24px;
        }

        /* Intro Screen */
        .quiz-intro {
            text-align: center;
            border: 1px solid var(--color-text);
            padding: 60px 40px;
            position: relative;
        }

        .quiz-intro::before {
            content: '// ДІАГНОСТИКА';
            position: absolute;
            top: -12px;
            left: 24px;
            background: var(--color-bg);
            padding: 0 12px;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .quiz-intro h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 16px;
            line-height: 1.2;
        }

        .quiz-intro p {
            font-size: 1.125rem;
            color: #404040;
            margin-bottom: 40px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .quiz-benefits {
            display: flex;
            gap: 32px;
            justify-content: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .benefit {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.875rem;
            font-family: var(--font-mono);
        }

        .benefit::before {
            content: '✓';
            color: var(--color-accent);
            font-size: 1.2rem;
            font-weight: bold;
        }

        /* Main Quiz Container */
        .quiz-container {
            border: 1px solid var(--color-text);
            padding: 48px;
            position: relative;
            display: none;
        }

        .quiz-container.active {
            display: block;
        }

        /* Progress Bar */
        .quiz-progress {
            position: absolute;
            top: -12px;
            left: 24px;
            background: var(--color-bg);
            padding: 0 12px;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .progress-bar {
            height: 2px;
            background: var(--color-border);
            margin-bottom: 40px;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: var(--color-accent);
            transition: width 0.3s ease;
        }

        /* Question */
        .quiz-question {
            margin-bottom: 40px;
        }

        .question-number {
            font-family: var(--font-mono);
            font-size: 0.875rem;
            color: var(--color-secondary);
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .quiz-question h2 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 32px;
        }

        /* Options */
        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .option {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            padding: 20px;
            border: 1px solid var(--color-border);
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .option:hover {
            border-color: var(--color-text);
            background: #F8F9FA;
        }

        .option.selected {
            border-color: var(--color-text);
            background: var(--color-accent);
        }

        .option input[type="radio"],
        .option input[type="checkbox"] {
            margin-top: 4px;
            width: 20px;
            height: 20px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .option-content {
            flex: 1;
        }

        .option-label {
            font-size: 1.125rem;
            font-weight: 600;
            display: block;
            margin-bottom: 4px;
        }

        .option-hint {
            font-size: 0.875rem;
            color: #404040;
        }

        .option-input {
            margin-top: 12px;
            width: 100%;
            padding: 12px;
            border: 1px solid var(--color-border);
            font-family: var(--font-main);
            font-size: 1rem;
        }

        .option-input:focus {
            outline: none;
            border-color: var(--color-text);
        }

        /* Checkboxes limit warning */
        .limit-warning {
            font-size: 0.875rem;
            color: #DC2626;
            margin-top: 8px;
            display: none;
        }

        .limit-warning.active {
            display: block;
        }

        /* Navigation Buttons */
        .quiz-navigation {
            display: flex;
            gap: 16px;
            justify-content: space-between;
            margin-top: 48px;
        }

        .btn {
            padding: 16px 32px;
            font-family: var(--font-mono);
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 1px solid var(--color-text);
            background: var(--color-bg);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: var(--color-text);
            color: var(--color-bg);
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .btn:disabled:hover {
            background: var(--color-bg);
            color: var(--color-text);
        }

        .btn-primary {
            background: var(--color-accent);
            border-color: var(--color-accent);
            color: var(--color-text);
        }

        .btn-primary:hover {
            background: #E6C200;
            border-color: #E6C200;
        }

        /* Contact Form */
        .contact-form {
            display: none;
        }

        .contact-form.active {
            display: block;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-label.required::after {
            content: '*';
            color: var(--color-accent);
            margin-left: 4px;
        }

        .form-input {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--color-border);
            font-family: var(--font-main);
            font-size: 1rem;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--color-text);
        }

        .form-radio-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .form-radio {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .form-radio input {
            width: 18px;
            height: 18px;
        }

        .form-checkbox {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-top: 24px;
        }

        .form-checkbox input {
            width: 20px;
            height: 20px;
            margin-top: 2px;
            flex-shrink: 0;
        }

        /* Result Screen */
        .quiz-result {
            display: none;
        }

        .quiz-result.active {
            display: block;
        }

        .result-icon {
            font-size: 1rem;
            font-family: var(--font-mono);
            font-weight: 700;
            margin-bottom: 24px;
            text-align: center;
            color: var(--color-text);
            letter-spacing: 2px;
            border: 2px solid var(--color-text);
            display: inline-block;
            padding: 12px 24px;
            background: var(--color-accent);
        }

        .result-title {
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 40px;
        }

        .result-icon-wrapper {
            text-align: center;
            margin-bottom: 24px;
        }

        .result-profile {
            background: #F8F9FA;
            padding: 24px;
            border: 1px solid var(--color-border);
            margin-bottom: 32px;
        }

        .result-profile h3 {
            font-size: 1.125rem;
            margin-bottom: 12px;
            font-family: var(--font-mono);
            text-transform: uppercase;
            font-size: 0.875rem;
            letter-spacing: 1px;
        }

        .result-profile ul {
            list-style: none;
        }

        .result-profile li {
            padding: 4px 0;
            padding-left: 16px;
            position: relative;
        }

        .result-profile li::before {
            content: '•';
            position: absolute;
            left: 0;
        }

        .result-content h4 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .result-content p {
            margin-bottom: 16px;
            font-size: 1.0625rem;
            line-height: 1.7;
        }

        .result-list {
            list-style: none;
            margin: 24px 0;
        }

        .result-list li {
            padding: 8px 0;
            padding-left: 24px;
            position: relative;
        }

        .result-list li::before {
            content: '✓';
            position: absolute;
            left: 0;
            color: var(--color-accent);
            font-weight: bold;
        }

        .result-box {
            background: var(--color-accent);
            padding: 24px;
            margin: 32px 0;
            border: 1px solid var(--color-text);
        }

        .result-box h5 {
            font-family: var(--font-mono);
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .result-warning {
            background: #FEF2F2;
            border: 1px solid #DC2626;
            padding: 24px;
            margin: 32px 0;
        }

        .result-warning h5 {
            color: #DC2626;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .result-cta {
            display: flex;
            gap: 16px;
            margin-top: 40px;
            flex-wrap: wrap;
        }

        .result-secondary {
            margin-top: 32px;
            padding-top: 32px;
            border-top: 1px solid var(--color-border);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 40px 16px;
            }

            .quiz-intro,
            .quiz-container {
                padding: 32px 24px;
            }

            .quiz-intro h1 {
                font-size: 2rem;
            }

            .quiz-benefits {
                flex-direction: column;
                align-items: center;
            }

            .quiz-question h2 {
                font-size: 1.5rem;
            }

            .quiz-navigation {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }

            .result-cta {
                flex-direction: column;
            }
        }

        /* Hidden class */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Intro Screen -->
        <div id="intro" class="quiz-intro active">
            <h1>Не впевнені що вам підходить?</h1>
            <p>Відповісте на 5 питань — ми підготуємо персональну рекомендацію та підберемо оптимальне рішення</p>
            
            <div class="quiz-benefits">
                <div class="benefit">Займе 60 секунд</div>
                <div class="benefit">Персональна рекомендація</div>
                <div class="benefit">Орієнтовна вартість</div>
            </div>

            <button class="btn btn-primary" onclick="startQuiz()">Пройти діагностику</button>
        </div>

        <!-- Quiz Container -->
        <div id="quiz" class="quiz-container">
            <div class="quiz-progress">ПИТАННЯ <span id="current-q">1</span> З 5</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>

            <!-- Questions will be inserted here -->
            <div id="quiz-content"></div>

            <div class="quiz-navigation">
                <button class="btn" id="btn-back" onclick="previousQuestion()" disabled>← Назад</button>
                <button class="btn btn-primary" id="btn-next" onclick="nextQuestion()">Далі →</button>
            </div>
        </div>

        <!-- Contact Form -->
        <div id="contact-form" class="quiz-container contact-form">
            <div class="quiz-progress">ОСТАННІЙ КРОК</div>
            <div class="progress-bar">
                <div class="progress-fill" style="width: 100%"></div>
            </div>

            <div class="quiz-question">
                <h2>Куди надіслати результат та коли зручно зателефонувати?</h2>

                <div class="form-group">
                    <label class="form-label required">Ваше ім'я</label>
                    <input type="text" id="contact-name" class="form-input" required>
                </div>

                <div class="form-group">
                    <label class="form-label required">Телефон</label>
                    <input type="tel" id="contact-phone" class="form-input" placeholder="+380" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Email (необов'язково)</label>
                    <input type="email" id="contact-email" class="form-input">
                </div>

                <div class="form-group">
                    <label class="form-label">Коли зручно зателефонувати?</label>
                    <div class="form-radio-group">
                        <label class="form-radio">
                            <input type="radio" name="call-time" value="today_18" checked>
                            <span>Сьогодні до 18:00</span>
                        </label>
                        <label class="form-radio">
                            <input type="radio" name="call-time" value="tomorrow_12">
                            <span>Завтра з 10:00 до 12:00</span>
                        </label>
                        <label class="form-radio">
                            <input type="radio" name="call-time" value="tomorrow_18">
                            <span>Завтра з 14:00 до 18:00</span>
                        </label>
                        <label class="form-radio">
                            <input type="radio" name="call-time" value="other">
                            <span>Інший час (напишу в коментарі)</span>
                        </label>
                    </div>
                </div>

                <div class="form-group hidden" id="other-time-group">
                    <label class="form-label">Напишіть коли вам зручно</label>
                    <input type="text" id="other-time" class="form-input">
                </div>

                <div class="form-checkbox">
                    <input type="checkbox" id="privacy" required>
                    <label for="privacy">Погоджуюсь з політикою конфіденційності</label>
                </div>
            </div>

            <div class="quiz-navigation">
                <button class="btn" onclick="backToQuiz()">← Назад</button>
                <button class="btn btn-primary" onclick="submitQuiz()">Отримати персональну рекомендацію</button>
            </div>
        </div>

        <!-- Result Screen -->
        <div id="result" class="quiz-container quiz-result">
            <div id="result-content"></div>
        </div>
    </div>

    <script>
        // Quiz Data
        const quizData = {
            questions: [
                {
                    id: 'businessType',
                    number: 1,
                    title: 'Як ви працюєте з клієнтами?',
                    type: 'radio',
                    options: [
                        {
                            value: 'b2b',
                            label: 'B2B (продаємо бізнесу)',
                            hint: 'Цикл угоди довгий, потрібен контроль етапів'
                        },
                        {
                            value: 'b2c',
                            label: 'B2C (продаємо кінцевим споживачам)',
                            hint: 'Цикл короткий, важлива швидкість обробки'
                        },
                        {
                            value: 'both',
                            label: 'B2B + B2C (обидва напрямки)',
                            hint: 'Потрібні різні воронки для різних клієнтів'
                        }
                    ]
                },
                {
                    id: 'teamSize',
                    number: 2,
                    title: 'Скільки людей у вашій команді?',
                    type: 'radio',
                    options: [
                        {
                            value: '1-3',
                            label: '1-3 особи',
                            hint: 'Тільки починаємо'
                        },
                        {
                            value: '3-15',
                            label: '3-15 осіб',
                            hint: 'Малий бізнес, потрібна система'
                        },
                        {
                            value: '15-35',
                            label: '15-35 осіб',
                            hint: 'Середній бізнес, вже є хаос'
                        },
                        {
                            value: '35+',
                            label: '35-100+ осіб',
                            hint: 'Великий бізнес, складні процеси'
                        }
                    ]
                },
                {
                    id: 'systems',
                    number: 3,
                    title: 'Які системи вже працюють у вас?',
                    type: 'checkbox',
                    options: [
                        {
                            value: 'nothing',
                            label: 'Нічого (працюємо в Excel/блокнотах)',
                            hint: ''
                        },
                        {
                            value: 'crm',
                            label: 'CRM система',
                            hint: '',
                            hasInput: true,
                            inputPlaceholder: 'Яка саме?'
                        },
                        {
                            value: 'accounting',
                            label: 'Бухгалтерія/облік (Medoc, Finsmart, 1С)',
                            hint: '',
                            hasInput: true,
                            inputPlaceholder: 'Яка саме?'
                        },
                        {
                            value: 'tasks',
                            label: 'Таск-менеджер (Asana, Trello, інше)',
                            hint: ''
                        },
                        {
                            value: 'portal',
                            label: 'Корпоративний портал',
                            hint: ''
                        }
                    ]
                },
                {
                    id: 'pains',
                    number: 4,
                    title: 'Що найбільше болить зараз?',
                    subtitle: 'Оберіть до 3 варіантів',
                    type: 'checkbox',
                    maxSelect: 3,
                    options: [
                        {
                            value: 'lost_clients',
                            label: 'Втрачаємо клієнтів між менеджерами'
                        },
                        {
                            value: 'unknown_source',
                            label: 'Не знаємо звідки прийшов клієнт'
                        },
                        {
                            value: 'old_base',
                            label: 'Менеджери працюють тільки зі старою базою'
                        },
                        {
                            value: 'no_control',
                            label: 'Немає контролю за угодами'
                        },
                        {
                            value: 'hard_training',
                            label: 'Складно навчити нових співробітників'
                        },
                        {
                            value: 'task_chaos',
                            label: 'Хаос у завданнях та дедлайнах'
                        },
                        {
                            value: 'reporting_time',
                            label: 'Витрачаємо багато часу на звітність'
                        },
                        {
                            value: 'no_visibility',
                            label: 'Керівник не бачить повну картину'
                        }
                    ]
                },
                {
                    id: 'decisionMaker',
                    number: 5,
                    title: 'Хто буде приймати рішення про впровадження?',
                    type: 'radio',
                    options: [
                        {
                            value: 'owner',
                            label: 'Я власник/співвласник',
                            hint: 'Приймаю рішення сам'
                        },
                        {
                            value: 'director',
                            label: 'Я директор (найманий)',
                            hint: 'Потрібно узгодження з власником'
                        },
                        {
                            value: 'head',
                            label: 'Я керівник відділу',
                            hint: 'Потрібно узгодження з директором'
                        },
                        {
                            value: 'responsible',
                            label: 'Я відповідальний за проєкт',
                            hint: 'Маю повноваження прийняти рішення'
                        }
                    ]
                }
            ]
        };

        // Quiz State
        let currentQuestion = 0;
        let answers = {
            businessType: '',
            teamSize: '',
            systems: {},
            pains: [],
            decisionMaker: '',
            contact: {}
        };

        // Start Quiz
        function startQuiz() {
            document.getElementById('intro').classList.remove('active');
            document.getElementById('quiz').classList.add('active');
            renderQuestion();
        }

        // Render Question
        function renderQuestion() {
            const question = quizData.questions[currentQuestion];
            const content = document.getElementById('quiz-content');
            
            let html = `
                <div class="quiz-question">
                    <div class="question-number">Питання ${question.number} з 5</div>
                    <h2>${question.title}</h2>
                    ${question.subtitle ? `<p style="margin-bottom: 24px; color: #404040;">${question.subtitle}</p>` : ''}
                    <div class="quiz-options">
            `;

            question.options.forEach((option, index) => {
                const inputType = question.type;
                const inputName = question.id; // Всі checkboxes в одній групі мають однакове name
                const isChecked = question.type === 'radio' 
                    ? answers[question.id] === option.value
                    : answers[question.id] && (
                        answers[question.id][option.value] === true || 
                        (typeof answers[question.id][option.value] === 'string' && answers[question.id][option.value] !== '')
                    );

                html += `
                    <label class="option ${isChecked ? 'selected' : ''}" data-value="${option.value}">
                        <input type="${inputType}" 
                               name="${inputName}" 
                               value="${option.value}"
                               ${isChecked ? 'checked' : ''}
                               onchange="handleAnswer('${question.id}', '${option.value}', '${question.type}', ${question.maxSelect || 'null'})">
                        <div class="option-content">
                            <span class="option-label">${option.label}</span>
                            ${option.hint ? `<span class="option-hint">${option.hint}</span>` : ''}
                            ${option.hasInput ? `
                                <input type="text" 
                                       class="option-input" 
                                       placeholder="${option.inputPlaceholder}"
                                       value="${answers[question.id] && answers[question.id][option.value + '_name'] || ''}"
                                       onchange="handleInputAnswer('${question.id}', '${option.value}', this.value)"
                                       onclick="event.stopPropagation()">
                            ` : ''}
                        </div>
                    </label>
                `;
            });

            if (question.maxSelect) {
                html += `<div class="limit-warning" id="limit-warning">Можна обрати максимум ${question.maxSelect} варіанти</div>`;
            }

            html += `
                    </div>
                </div>
            `;

            content.innerHTML = html;
            updateProgress();
            updateButtons();
        }

        // Handle Answer
        function handleAnswer(questionId, value, type, maxSelect) {
            const question = quizData.questions[currentQuestion];
            
            if (type === 'radio') {
                answers[questionId] = value;
                
                // Update UI
                document.querySelectorAll('.option').forEach(opt => {
                    opt.classList.remove('selected');
                });
                event.target.closest('.option').classList.add('selected');
            } else if (type === 'checkbox') {
                // Handle "nothing" exclusive selection
                if (value === 'nothing') {
                    if (event.target.checked) {
                        // Uncheck all others
                        answers[questionId] = { nothing: true };
                        document.querySelectorAll(`input[type="checkbox"]`).forEach(cb => {
                            if (cb.value !== 'nothing') cb.checked = false;
                        });
                        document.querySelectorAll('.option').forEach(opt => {
                            if (opt.dataset.value !== 'nothing') opt.classList.remove('selected');
                        });
                    } else {
                        delete answers[questionId].nothing;
                    }
                } else {
                    // Uncheck "nothing" if selecting something else
                    if (answers[questionId] && answers[questionId].nothing) {
                        delete answers[questionId].nothing;
                        const nothingCheckbox = document.querySelector(`input[value="nothing"]`);
                        if (nothingCheckbox) nothingCheckbox.checked = false;
                        const nothingOption = document.querySelector(`.option[data-value="nothing"]`);
                        if (nothingOption) nothingOption.classList.remove('selected');
                    }

                    if (!answers[questionId]) answers[questionId] = {};

                    if (event.target.checked) {
                        // Check if max limit reached
                        const selectedCount = Object.keys(answers[questionId]).filter(k => !k.endsWith('_name')).length;
                        if (maxSelect && selectedCount >= maxSelect) {
                            event.target.checked = false;
                            document.getElementById('limit-warning').classList.add('active');
                            setTimeout(() => {
                                document.getElementById('limit-warning').classList.remove('active');
                            }, 3000);
                            return;
                        }
                        answers[questionId][value] = true;
                    } else {
                        delete answers[questionId][value];
                        delete answers[questionId][value + '_name'];
                    }
                }

                // Update UI
                if (event.target.checked) {
                    event.target.closest('.option').classList.add('selected');
                } else {
                    event.target.closest('.option').classList.remove('selected');
                }
            }

            updateButtons();
        }

        // Handle Input Answer
        function handleInputAnswer(questionId, value, inputValue) {
            if (!answers[questionId]) answers[questionId] = {};
            answers[questionId][value + '_name'] = inputValue;
        }

        // Update Progress
        function updateProgress() {
            const progress = ((currentQuestion + 1) / quizData.questions.length) * 100;
            document.getElementById('progress-fill').style.width = progress + '%';
            document.getElementById('current-q').textContent = currentQuestion + 1;
        }

        // Update Buttons
        function updateButtons() {
            const question = quizData.questions[currentQuestion];
            const backBtn = document.getElementById('btn-back');
            const nextBtn = document.getElementById('btn-next');

            // Back button
            backBtn.disabled = currentQuestion === 0;

            // Next button
            let canProceed = false;
            if (question.type === 'radio') {
                canProceed = answers[question.id] !== '';
            } else if (question.type === 'checkbox') {
                canProceed = answers[question.id] && Object.keys(answers[question.id]).some(k => !k.endsWith('_name'));
            }

            nextBtn.disabled = !canProceed;

            // Update next button text
            if (currentQuestion === quizData.questions.length - 1) {
                nextBtn.textContent = 'Отримати результат →';
            }
        }

        // Next Question
        function nextQuestion() {
            if (currentQuestion < quizData.questions.length - 1) {
                currentQuestion++;
                renderQuestion();
            } else {
                // Go to contact form
                document.getElementById('quiz').classList.remove('active');
                document.getElementById('contact-form').classList.add('active');
            }
        }

                renderQuestion();
            }

        // Generate Profile
        function generateProfile() {
            const businessType = {
                'b2b': 'B2B бізнес',
                'b2c': 'B2C бізнес',
                'both': 'B2B + B2C'
            }[answers.businessType] || '';

            const teamSize = {
                '1-3': '1-3 особи',
                '3-15': '3-15 осіб',
                '15-35': '15-35 осіб',
                '35+': '35-100+ осіб'
            }[answers.teamSize] || '';

            let systems = [];
            if (answers.systems) {
                if (answers.systems.nothing) systems.push('Немає систем');
                if (answers.systems.crm) {
                    const crmName = answers.systems.crm_name ? ` (${answers.systems.crm_name})` : '';
                    systems.push('Є CRM' + crmName);
                }
                if (answers.systems.accounting) {
                    const accName = answers.systems.accounting_name ? ` (${answers.systems.accounting_name})` : '';
                    systems.push('Є облікова система' + accName);
                }
                if (answers.systems.tasks) systems.push('Є таск-менеджер');
                if (answers.systems.portal) systems.push('Є портал');
            }

            const pains = {
                'lost_clients': 'втрачаємо клієнтів',
                'unknown_source': 'не знаємо звідки клієнт',
                'old_base': 'менеджери зі старою базою',
                'no_control': 'немає контролю',
                'hard_training': 'складно навчити нових',
                'task_chaos': 'хаос у завданнях',
                'reporting_time': 'багато часу на звіти',
                'no_visibility': 'керівник не бачить картину'
            };

            const painsList = answers.pains.map(p => pains[p]).filter(Boolean);

            const decisionMaker = {
                'owner': 'Власник',
                'director': 'Директор (найманий)',
                'head': 'Керівник відділу',
                'responsible': 'Відповідальний за проєкт'
            }[answers.decisionMaker] || '';

            return `
                <div class="result-profile">
                    <h3>Ваш профіль</h3>
                    <ul>
                        ${businessType ? `<li>${businessType}</li>` : ''}
                        ${teamSize ? `<li>${teamSize} у команді</li>` : ''}
                        ${systems.length > 0 ? systems.map(s => `<li>${s}</li>`).join('') : ''}
                        ${painsList.length > 0 ? `<li>Болить: ${painsList.join(', ')}</li>` : ''}
                        ${decisionMaker ? `<li>ЛПР: ${decisionMaker}</li>` : ''}
                    </ul>
                </div>
            `;
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            console.log('CRM Customs Quiz loaded');
        });
    </script>
