name: Autopost — scheduled publish

# Merges today's pre-generated autopost PR (opened a few days earlier by
# autopost.yml, labeled publish:<today>), if it's still open. This is the
# actual "go live" moment — merging triggers deploy.yml and
# social-crosspost.yml exactly like any other push to main. If the owner
# edited or closed the PR during the review window, that's respected: an
# edited-but-still-open PR merges with the edits, a closed one is skipped.

on:
  schedule:
    - cron: '0 7 * * 1,3,5' # same Mon/Wed/Fri, 07:00 UTC — the actual publish moment
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      HAS_TELEGRAM_OWNER_CHAT: ${{ secrets.TELEGRAM_OWNER_CHAT_ID != '' }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge today's scheduled autopost PR, if any
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLANFIX_ACCOUNT: ${{ secrets.PLANFIX_ACCOUNT }}
          PLANFIX_TOKEN: ${{ secrets.PLANFIX_TOKEN }}
        run: |
          TODAY=$(date -u +%F)
          PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --label "publish:$TODAY" --state open --json number -q '.[0].number')
          if [ -z "$PR" ]; then
            echo "No open PR labeled publish:$TODAY — nothing scheduled for today, or it was already handled."
            exit 0
          fi

          # The PlanFix task id (if any) rode along as a "planfix:<id>" label
          # since autopost.yml created the task — read it before merging
          # deletes the branch/PR labels along with it.
          PF_TASK_ID=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels -q '.labels[].name' | grep -o '^planfix:[0-9]\+$' | cut -d: -f2 || true)

          echo "Merging PR #$PR (label publish:$TODAY)"
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --merge --delete-branch

          # The PlanFix task (planfix:$PF_TASK_ID) is deliberately left in
          # "Ідея": the PlanFix content factory posts it to Instagram/Threads/
          # LinkedIn at its endDateTime and sets "Опубліковано" itself. Flipping
          # it here first made the factory skip the task.
          [ -n "$PF_TASK_ID" ] && echo "PlanFix task $PF_TASK_ID left for the content factory to publish and close"

      # Telegram ONLY on errors. Private chat only — never the public channel.
      - name: Alert owner on failure
        if: ${{ failure() && env.HAS_TELEGRAM_OWNER_CHAT == 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TEXT=$(printf '🚨 <b>Публікація статті не відбулась</b>\nНе вдалось змерджити сьогоднішній PR.\n\n1. Лог: %s\n2. Змердж PR вручну' "$RUN_URL")
          curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d "chat_id=$TELEGRAM_OWNER_CHAT_ID" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text=$TEXT"
